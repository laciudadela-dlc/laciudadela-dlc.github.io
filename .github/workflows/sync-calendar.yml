name: Sync Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'  # Todos los días a las 8AM Argentina (11 UTC)

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        run: cd scripts && npm install

      - name: Sync Google Calendar → Firestore → Mesas
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: cd scripts && node sync-calendar.js
