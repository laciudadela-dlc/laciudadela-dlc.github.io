<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Mensajes · La Ciudadela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:        #FFFFFF;
  --bg2:       #F4F3F0;
  --bg3:       #E8E7E3;
  --ink:       #111110;
  --ink2:      #383836;
  --muted:     #6B6A67;
  --gold:      #383836;
  --gold2:     #111110;
  --brd:       #DDDBD4;
  --brd-dark:  #C4C2BA;
  --red:       #B91C1C;
  --red-light: #FEF2F2;
  --header-bg: #FFFFFF;
}
html,body{min-height:100%;background:var(--bg);}

.header{background:var(--bg);border-bottom:2px solid var(--ink2);padding:12px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;}
.header-back{font-family:'DM Sans',sans-serif;font-size:8px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--ink2);padding:6px 12px;text-decoration:none;transition:all .15s;}
.header-back:hover{background:var(--ink);color:#fff;}
.header-title{font-family:'Cinzel',serif;font-size:14px;color:var(--ink);flex:1;}
.header-user{display:flex;align-items:center;gap:8px;}
.header-avatar{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink2);object-fit:cover;}
.header-name{font-family:'DM Sans',sans-serif;font-size:8px;color:var(--ink2);letter-spacing:.06em;}

.page-body{max-width:900px;margin:0 auto;padding:20px;display:grid;grid-template-columns:270px 1fr;gap:0;height:calc(100vh - 62px);}
@media(max-width:680px){
  .page-body{grid-template-columns:1fr;height:auto;padding:0;}
  .sidebar{border-right:none;border-bottom:1px solid var(--brd);}
  .chat-panel{min-height:400px;}
}

.sidebar{border:1px solid var(--brd);border-right:none;display:flex;flex-direction:column;overflow:hidden;background:var(--bg2);}
.sidebar-header{padding:12px 14px;border-bottom:1px solid var(--brd);font-family:'DM Sans',sans-serif;font-size:9px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.new-btn{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;background:var(--ink);color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;}
.new-btn:hover{background:#e8bc38;}

.contact-panel{display:none;border-bottom:1px solid var(--brd);padding:12px 14px;flex-direction:column;gap:8px;background:var(--bg2);flex-shrink:0;}
.contact-panel.open{display:flex;}
.contact-label{font-family:'DM Sans',sans-serif;font-size:8px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink2);}
.contact-list{display:flex;flex-direction:column;gap:3px;max-height:160px;overflow-y:auto;}
.contact-item{display:flex;align-items:center;gap:8px;padding:7px 8px;cursor:pointer;border:1px solid transparent;transition:all .12s;}
.contact-item:hover{border-color:var(--brd);background:var(--bg2);}
.contact-item.selected{border-color:var(--ink2);background:var(--bg2);}
.contact-avatar{width:26px;height:26px;border-radius:50%;border:1px solid var(--brd);object-fit:cover;flex-shrink:0;}
.contact-name{font-size:12px;color:var(--muted);flex:1;}
.contact-role{font-size:9px;color:var(--muted);}
.contact-start-btn{font-family:'DM Sans',sans-serif;font-size:8px;letter-spacing:.01em;text-transform:uppercase;background:var(--ink);color:#fff;border:none;padding:9px;cursor:pointer;width:100%;margin-top:4px;}
.contact-start-btn:hover{background:#e8bc38;}
.contact-start-btn:disabled{background:#555;color:var(--muted);cursor:default;}

.conv-list{flex:1;overflow-y:auto;}
.conv-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--brd);cursor:pointer;transition:background .12s;}
.conv-item:hover{background:var(--bg2);}
.conv-item.active{background:var(--bg2);border-left:3px solid var(--ink2);}
.conv-avatar{width:34px;height:34px;border-radius:50%;border:1px solid var(--brd);object-fit:cover;flex-shrink:0;}
.conv-info{flex:1;min-width:0;}
.conv-name{font-family:'DM Sans',sans-serif;font-size:9px;letter-spacing:.06em;color:var(--ink);}
.conv-last{font-size:11px;color:#777;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
.conv-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.conv-time{font-size:9px;color:#555;}
.conv-unread{width:8px;height:8px;border-radius:50%;background:var(--ink2);}
.conv-empty{padding:28px 16px;text-align:center;color:#555;font-size:12px;line-height:1.6;}

.chat-panel{border:1px solid var(--brd);display:flex;flex-direction:column;overflow:hidden;}
.chat-header{padding:13px 16px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px;flex-shrink:0;min-height:56px;}
.chat-partner-avatar{width:32px;height:32px;border-radius:50%;border:1px solid var(--brd);object-fit:cover;}
.chat-partner-name{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.06em;color:var(--ink);flex:1;}
.chat-partner-role{font-family:'DM Sans',sans-serif;font-size:7px;letter-spacing:.01em;text-transform:uppercase;padding:2px 8px;border-radius:2px;background:var(--bg2);color:var(--ink2);}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:100px;background:var(--bg2);}
.msg{max-width:78%;padding:10px 14px;line-height:1.5;}
.msg.mine{align-self:flex-end;background:var(--ink);border:1px solid var(--ink);color:#fff;}
.msg.theirs{align-self:flex-start;background:#FFFFFF;border:1px solid var(--brd-dark);color:var(--ink);}
.msg-text{font-size:13px;color:var(--ink);font-family:'DM Sans',sans-serif;}
.msg-time{font-size:9px;color:var(--muted);margin-top:4px;text-align:right;}
.chat-input-area{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--brd);flex-shrink:0;}
.chat-input{flex:1;background:var(--bg3);border:1px solid var(--brd);color:var(--ink);padding:10px 12px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;resize:none;max-height:100px;}
.chat-input:focus{border-color:var(--ink2);}
.chat-send{font-family:'DM Sans',sans-serif;font-size:8px;letter-spacing:.01em;text-transform:uppercase;background:var(--ink);color:#fff;border:none;padding:10px 16px;cursor:pointer;align-self:flex-end;transition:background .15s;flex-shrink:0;}
.chat-send:hover{background:var(--ink2);}
.chat-placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#444;}
.chat-placeholder-icon{font-size:40px;opacity:.25;}
.chat-placeholder-text{font-family:'DM Sans',sans-serif;font-size:9px;letter-spacing:.02em;text-transform:uppercase;}

.guard{display:none;position:fixed;inset:0;background:var(--bg-darker);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:20px;}
.guard.show{display:flex;}
.guard-title{font-family:'Cinzel',serif;font-size:18px;color:var(--ink);}
.guard-sub{font-size:13px;color:var(--muted);}
.guard-btn{font-family:'DM Sans',sans-serif;font-size:9px;letter-spacing:.02em;text-transform:uppercase;background:var(--ink);color:#fff;border:none;padding:10px 24px;cursor:pointer;margin-top:8px;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--bg);border:1px solid var(--ink2);padding:10px 20px;font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:.01em;color:var(--ink2);opacity:0;transition:all .3s;pointer-events:none;z-index:999;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.toast.err{border-color:var(--red);color:#faa;}
</style>
</head>
<body>

<div class="guard" id="guard">
  <div class="guard-title">⚔ La Ciudadela</div>
  <div class="guard-sub">Necesitás iniciar sesión para ver tus mensajes.</div>
  <button class="guard-btn" onclick="location.href='../'">Ir al Portal</button>
</div>

<div class="toast" id="toast"></div>

<header class="header">
  <a class="header-back" href="../">← Portal</a>
  <div class="header-title">Mensajes</div>
  <div class="header-user" id="headerUser"></div>
</header>

<div class="page-body">
  <div class="sidebar">
    <div class="sidebar-header">
      Conversaciones
      <button class="new-btn" id="newBtn" onclick="toggleContactPanel()">+ Nueva</button>
    </div>

    <div class="contact-panel" id="contactPanel">
      <div class="contact-label">Escribirle a:</div>
      <div class="contact-list" id="contactList">
        <div style="font-size:12px;color:#555;padding:6px;">Cargando…</div>
      </div>
      <button class="contact-start-btn" id="startBtn" onclick="startConv()" disabled>
        Iniciar conversación
      </button>
    </div>

    <div class="conv-list" id="convList">
      <div class="conv-empty">Cargando…</div>
    </div>
  </div>

  <div class="chat-panel">
    <div class="chat-header" id="chatHeader">
      <div class="chat-placeholder">
        <div class="chat-placeholder-icon">💬</div>
        <div class="chat-placeholder-text">Seleccioná una conversación</div>
      </div>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="chat-placeholder" style="flex:1;">
      </div>
    </div>
    <div class="chat-input-area" id="chatInputArea" style="display:none;">
      <textarea class="chat-input" id="chatInput" rows="2"
        placeholder="Escribí tu mensaje… (Enter para enviar)"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
      <button class="chat-send" onclick="sendMsg()">Enviar</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyC90qr4C7V68upNyUrWcbLEtCCTZDZhUy0",
  authDomain:"ciudadela-portal-88111.firebaseapp.com",
  projectId:"ciudadela-portal-88111",
  storageBucket:"ciudadela-portal-88111.firebasestorage.app",
  messagingSenderId:"629290273583",
  appId:"1:629290273583:web:47e321d389fb0e49a6afda"
});
const auth = firebase.auth();
const db   = firebase.firestore();

// ── ESTADO ───────────────────────────────────────────
let ME          = null;   // firebase user
let MY_PROFILE  = null;   // firestore doc
let MY_CONVS    = [];     // conversaciones cacheadas
let ALL_USERS   = [];     // todos los usuarios (para resolver nombres)
let CONTACTS    = [];     // a quienes puede escribir
let SEL_CONTACT = null;   // contacto seleccionado en el panel nuevo
let CURRENT_CONV= null;   // convId abierto
let unsubConvs  = null;
let unsubChat   = null;

// ── AUTH ─────────────────────────────────────────────
auth.onAuthStateChanged(async user => {
  if (!user) { document.getElementById('guard').classList.add('show'); return; }
  ME = user;

  // Cargar perfil
  const snap = await db.collection('usuarios').doc(user.uid).get();
  MY_PROFILE = snap.exists ? snap.data() : { roles: ['jugador'] };

  // Header
  const name = firstName(user.displayName || user.email);
  document.getElementById('headerUser').innerHTML = `
    <img class="header-avatar"
      src="${user.photoURL || avatar(name, 30)}" alt="">
    <span class="header-name">${esc(name)}</span>`;

  // Cargar usuarios y arrancar listeners
  await loadAllUsers();
  buildContacts();
  startConvListener();

  // Abrir conv desde URL ?conv=ID
  const convId = new URLSearchParams(location.search).get('conv');
  if (convId) openChat(convId);
});

// ── USUARIOS ─────────────────────────────────────────
async function loadAllUsers() {
  try {
    const snap = await db.collection('usuarios').where('activo', '==', true).get();
    ALL_USERS = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
  } catch(e) {
    console.error('loadAllUsers:', e);
  }
}

function buildContacts() {
  const myRoles = MY_PROFILE.roles || [];
  const isPrivileged = myRoles.includes('admin') || myRoles.includes('dm');
  CONTACTS = ALL_USERS.filter(u => {
    if (u.uid === ME.uid) return false;
    if (isPrivileged) return true;
    // jugadores solo ven admin y dm
    return (u.roles || []).some(r => r === 'admin' || r === 'dm');
  });
  renderContactList();
}

// ── PANEL NUEVO CONTACTO ──────────────────────────────
function toggleContactPanel() {
  const panel = document.getElementById('contactPanel');
  const isOpen = panel.classList.contains('open');
  panel.classList.toggle('open', !isOpen);
  if (!isOpen) {
    SEL_CONTACT = null;
    document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('selected'));
    document.getElementById('startBtn').disabled = true;
  }
}

function renderContactList() {
  const list = document.getElementById('contactList');
  if (!CONTACTS.length) {
    list.innerHTML = '<div style="font-size:12px;color:#555;padding:6px;">Sin contactos disponibles</div>';
    return;
  }
  list.innerHTML = CONTACTS.map(u => {
    const name = displayName(u);
    const role = (u.roles || ['jugador'])[0];
    return `
    <div class="contact-item" id="ct_${u.uid}" onclick="selectContact('${u.uid}')">
      <img class="contact-avatar" src="${u.photoURL || avatar(name, 26)}" alt="">
      <span class="contact-name">${esc(name)}</span>
      <span class="contact-role">${role}</span>
    </div>`;
  }).join('');
}

function selectContact(uid) {
  SEL_CONTACT = uid;
  document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('selected'));
  const el = document.getElementById('ct_' + uid);
  if (el) el.classList.add('selected');
  document.getElementById('startBtn').disabled = false;
}

async function startConv() {
  if (!SEL_CONTACT) return;
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = 'Creando…';

  try {
    // Buscar conv existente en el caché local (sin query adicional)
    const existing = MY_CONVS.find(c =>
      c.participantes && c.participantes.includes(SEL_CONTACT)
    );

    let convId;
    if (existing) {
      convId = existing.id;
    } else {
      const ref = await db.collection('mensajes').add({
        participantes: [ME.uid, SEL_CONTACT],
        tipo: 'user-user',
        ultimoMensaje: '',
        ultimoMensajeAt: firebase.firestore.FieldValue.serverTimestamp(),
        noLeidos: {}
      });
      convId = ref.id;
    }

    document.getElementById('contactPanel').classList.remove('open');
    SEL_CONTACT = null;
    openChat(convId);
  } catch(e) {
    console.error('startConv:', e);
    showToast('Error al crear la conversación', true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Iniciar conversación';
  }
}

// ── LISTA DE CONVERSACIONES ───────────────────────────
function startConvListener() {
  if (unsubConvs) unsubConvs();
  unsubConvs = db.collection('mensajes')
    .where('participantes', 'array-contains', ME.uid)
    .onSnapshot(snap => {
      MY_CONVS = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => {
          const ta = a.ultimoMensajeAt?.toMillis?.() || 0;
          const tb = b.ultimoMensajeAt?.toMillis?.() || 0;
          return tb - ta;
        });
      renderConvList();
    }, err => {
      console.error('convs listener:', err);
      showToast('Error al cargar conversaciones', true);
    });
}

function renderConvList() {
  const list = document.getElementById('convList');
  if (!MY_CONVS.length) {
    list.innerHTML = `<div class="conv-empty">Sin conversaciones aún.<br><br>Usá <strong>+ Nueva</strong> para escribirle a un Admin o DM.</div>`;
    return;
  }
  list.innerHTML = MY_CONVS.map(c => {
    const partnerId = c.participantes.find(p => p !== ME.uid) || c.participantes[0];
    const partner   = ALL_USERS.find(u => u.uid === partnerId) || { uid: partnerId };
    const name      = displayName(partner);
    const unread    = c.noLeidos?.[ME.uid] || 0;
    return `
    <div class="conv-item ${c.id === CURRENT_CONV ? 'active' : ''}"
         onclick="openChat('${c.id}')">
      <img class="conv-avatar"
        src="${partner.photoURL || avatar(name, 34)}" alt="">
      <div class="conv-info">
        <div class="conv-name">${esc(name)}</div>
        <div class="conv-last">${esc(c.ultimoMensaje || 'Conversación nueva')}</div>
      </div>
      <div class="conv-meta">
        <div class="conv-time">${fmtTime(c.ultimoMensajeAt)}</div>
        ${unread ? '<div class="conv-unread"></div>' : ''}
      </div>
    </div>`;
  }).join('');
}

// ── CHAT ─────────────────────────────────────────────
function openChat(convId) {
  CURRENT_CONV = convId;

  // Highlight en lista
  document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
  const convItem = document.querySelector(`.conv-item[onclick*="${convId}"]`);
  if (convItem) convItem.classList.add('active');

  // Marcar leídos
  db.collection('mensajes').doc(convId)
    .update({ [`noLeidos.${ME.uid}`]: 0 })
    .catch(() => {});

  // Resolver partner
  const conv = MY_CONVS.find(c => c.id === convId);
  let partnerId = conv
    ? conv.participantes.find(p => p !== ME.uid)
    : null;

  const partner = partnerId
    ? (ALL_USERS.find(u => u.uid === partnerId) || { uid: partnerId })
    : null;

  const name = partner ? displayName(partner) : '…';
  const role = partner ? ((partner.roles || ['jugador'])[0]) : '';

  document.getElementById('chatHeader').innerHTML = partner ? `
    <img class="chat-partner-avatar"
      src="${partner.photoURL || avatar(name, 32)}" alt="">
    <span class="chat-partner-name">${esc(name)}</span>
    <span class="chat-partner-role">${role}</span>` :
    '<div style="color:#888;font-size:12px;">Cargando…</div>';

  document.getElementById('chatInputArea').style.display = 'flex';

  // Suscribir mensajes en tiempo real
  if (unsubChat) unsubChat();
  const msgDiv = document.getElementById('chatMessages');
  msgDiv.innerHTML = '';

  unsubChat = db.collection('mensajes').doc(convId)
    .collection('items')
    .orderBy('creadoEn', 'asc')
    .onSnapshot(snap => {
      msgDiv.innerHTML = snap.docs.map(d => {
        const m    = d.data();
        const mine = m.de === ME.uid;
        return `
        <div class="msg ${mine ? 'mine' : 'theirs'}">
          <div class="msg-text">${esc(m.texto || '')}</div>
          <div class="msg-time">${fmtTime(m.creadoEn)}</div>
        </div>`;
      }).join('');
      msgDiv.scrollTop = msgDiv.scrollHeight;
    }, err => {
      console.error('chat listener:', err);
    });
}

// ── ENVIAR MENSAJE ────────────────────────────────────
async function sendMsg() {
  if (!ME || !CURRENT_CONV) return;
  const input = document.getElementById('chatInput');
  const texto = input.value.trim();
  if (!texto) return;
  input.value = '';
  input.style.height = 'auto';

  const now = firebase.firestore.FieldValue.serverTimestamp();

  try {
    // Resolver partner
    const conv = MY_CONVS.find(c => c.id === CURRENT_CONV);
    const partnerId = conv
      ? conv.participantes.find(p => p !== ME.uid)
      : null;

    // Guardar mensaje
    await db.collection('mensajes').doc(CURRENT_CONV)
      .collection('items').add({
        de: ME.uid, texto, leido: false, creadoEn: now
      });

    // Actualizar conversación
    const updates = {
      ultimoMensaje: texto,
      ultimoMensajeAt: now
    };
    if (partnerId) {
      updates[`noLeidos.${partnerId}`] = firebase.firestore.FieldValue.increment(1);
    }
    await db.collection('mensajes').doc(CURRENT_CONV).update(updates);

    // Notificación al partner
    if (partnerId) {
      const myName = firstName(ME.displayName || ME.email);
      await db.collection('notificaciones').doc(partnerId)
        .collection('items').add({
          tipo: 'mensaje',
          titulo: `Mensaje de ${myName}`,
          cuerpo: texto.length > 60 ? texto.substring(0, 60) + '…' : texto,
          convId: CURRENT_CONV,
          leida: false,
          creadoEn: now
        });
    }
  } catch(e) {
    console.error('sendMsg:', e);
    showToast('Error al enviar el mensaje', true);
  }
}

// ── HELPERS ──────────────────────────────────────────
function displayName(u) {
  if (!u) return '?';
  return u.displayName || (u.email || u.uid || '?').split('@')[0];
}
function firstName(str) {
  return (str || '?').split(' ')[0];
}
function avatar(name, size) {
  return `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=3a2000&color=c4a030&size=${size}`;
}
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtTime(ts) {
  if (!ts) return '';
  const d    = ts.toDate ? ts.toDate() : new Date(ts);
  const diff = Date.now() - d.getTime();
  if (diff < 60000)    return 'ahora';
  if (diff < 3600000)  return Math.floor(diff / 60000) + 'm';
  if (diff < 86400000) return Math.floor(diff / 3600000) + 'h';
  return d.toLocaleDateString('es-AR', { day:'numeric', month:'short' });
}
function showToast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
